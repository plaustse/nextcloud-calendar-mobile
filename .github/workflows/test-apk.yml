# Midlertidig byggeopskrift til at teste den danske oversættelse på en telefon.
# Kun i forken – kommer ikke med i pull requesten.
name: Test-APK (dansk)

on:
  workflow_dispatch:
  push:
    branches: [test/danish-apk]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable
      - name: Generate Android project
        run: |
          rm -rf android ios
          npx expo prebuild --platform android --no-install
          sed -i '/^org.gradle.jvmargs/d' android/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g' >> android/gradle.properties
      - name: Build release APK (signed with debug key, test only)
        working-directory: android
        run: ./gradlew assembleRelease -x lintVitalRelease -PreactNativeArchitectures=arm64-v8a
      - uses: actions/upload-artifact@v4
        with:
          name: kalender-dansk-test
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
